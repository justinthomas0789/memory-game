    <noscript>
      <main style="font-family:sans-serif;max-width:640px;margin:60px auto;padding:0 20px;color:#4a3728">
        <h1>Memory Game — Free Online Card Matching Game</h1>
        <p>Memory Game is a free browser-based card matching game. Flip cards to find all matching emoji pairs across Animals, Space, Food, Sports, and Nature themes. No download or account needed.</p>

        <h2>How to Play Memory Game</h2>
        <ol>
          <li>Choose a card theme, difficulty level, and game mode.</li>
          <li>Click any face-down card to flip it and reveal its emoji.</li>
          <li>Click a second card — if both show the same emoji, they stay face-up as a matched pair.</li>
          <li>If the cards don't match, both flip back face-down. Remember their positions!</li>
          <li>Keep going until all pairs are matched. Fewer moves = higher star rating.</li>
        </ol>

        <h2>Game Modes</h2>
        <ul>
          <li><strong>Classic</strong> — Match all pairs as quickly and efficiently as possible. Earn up to 3 stars.</li>
          <li><strong>Time Attack</strong> — Race against the clock. Find all pairs before time runs out.</li>
          <li><strong>Daily Challenge</strong> — One unique puzzle every day, the same for all players worldwide.</li>
          <li><strong>Two-Player</strong> — Take turns on the same screen. Most pairs wins.</li>
        </ul>

        <h2>Features</h2>
        <ul>
          <li>5 emoji themes: Animals, Space, Food, Sports, Nature</li>
          <li>Easy, Medium, and Hard difficulty levels</li>
          <li>5 unlockable achievements</li>
          <li>Works offline — installable as a PWA</li>
          <li>Share your score with friends</li>
        </ul>

        <h2>Frequently Asked Questions</h2>
        <dl>
          <dt><strong>Is Memory Game free?</strong></dt>
          <dd>Yes — completely free, no account, no download required.</dd>
          <dt><strong>Does it work on mobile?</strong></dt>
          <dd>Yes — fully responsive and installable as a PWA on any device.</dd>
          <dt><strong>What is the Daily Challenge?</strong></dt>
          <dd>A new puzzle generated every day, shared by all players. A new challenge unlocks at midnight.</dd>
        </dl>

        <p>Built by <a href="https://thecodewalker.dev">Justin Thomas (thecodewalker)</a>.</p>
        <p>JavaScript is required to play. Please enable JavaScript in your browser.</p>
      </main>
    </noscript>
