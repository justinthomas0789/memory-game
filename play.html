        <h1>Play Memory Game — Free Card Matching Game Online</h1>
        <p>Memory Game by Justin Thomas is a free browser-based card matching game. Flip emoji cards to find all matching pairs. No download or account required.</p>
        <h2>How to Play Memory Game</h2>
        <ol>
          <li>Choose a card theme, difficulty level, and game mode.</li>
          <li>Click any face-down card to flip it and reveal its emoji.</li>
          <li>Click a second card — if both show the same emoji, they stay face-up as a matched pair.</li>
          <li>If cards don't match, both flip back. Remember their positions!</li>
          <li>Match all pairs to win. Fewer moves = higher star rating.</li>
        </ol>
        <p><a href="/">← Back to home</a> · Built by <a href="https://thecodewalker.dev">Justin Thomas</a></p>
